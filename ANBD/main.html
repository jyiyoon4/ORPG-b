<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      p {
        margin: 0;
      }

      b {
        color: gray;
        font-size: 9pt;
        font-weight: 200;
      }

      span,
      b {
        font-size: 16px;
        font-family: 'Arial', sans-serif;
        line-height: 1.5;
      }

      b {
        font-weight: bold;
      }

      .ccfolia_wrap {
        position: relative;
        padding: 10px !important;
        background-color: #2c2c2cde;
        color: #fefefe;
      }
      .msg_container {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .msg_container img {
        width: 40px;
      }

      span:before {
        display: none !important ;
      }

      .gap {
        gap: 15px;
        display: flex;
        -webkit-box-pack: start;
        justify-content: flex-start;
        align-items: flex-start;
        position: relative;
        text-decoration: none;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        padding: 16px 16px;
      }
    </style>
  </head>
  <body>
    <div class="ccfolia_wrap">
      <div style="text-align: center; margin-top: 30px"></div>


      <div style="text-align: center; margin-top: 30px"></div>
    </div>
  </body>
</html>
