<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REM:IND - Dream Diary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="custom-cursor">
      <div id="custom-cursor">
        <svg viewBox="0 0 127 98" preserveAspectRatio="none">
          <path
          
            d="M126.36,78.25c-.37-.52-.74-1.03-1.13-1.54-1.08-1.38-2.26-2.74-3.51-4.04l-.34-.35-.35.35c-8.95,9.01-21.29,13.25-33.85,11.64-4.74-.61-9.23-2.01-13.34-4.11-1.01-4.51-1.23-9.19-.63-13.89,1.55-12.07,8.37-22.68,18.71-29.12l.66-.41-.66-.4C63.82,19.23,33.19,7.04.87.12l-.55-.12-.02.56c-1.46,33.01,2.61,65.73,12.1,97.24l.22.74.56-.53c8.83-8.32,20.79-12.21,32.8-10.67,4.69.6,9.15,1.99,13.26,4.1,1,4.51,1.23,9.22.62,13.97-1.61,12.57-8.83,23.43-19.8,29.82l-.42.25.26.42c.95,1.54,1.96,3.03,3.03,4.43.54.69,1.11,1.37,1.74,2.1l.23.27.32-.14c2.74-1.22,5.6-2.57,8.49-4.01l.15-.11c18.09-20.7,39.72-37.42,64.32-49.7l.15-.11c2.72-3.11,5.42-6.41,8.04-9.79l.22-.28-.2-.29Z"
          />
        </svg>
      </div>
    </div>
    <div id="app">
      <section id="landing" class="active">
        <div class="landing-fixed-content">
          <div class="crescent-container">
            <div class="crescent-moon"></div>
          </div>
          <h1 class="landing-title">당신은 지금 꿈을 꾸고 있습니까?</h1>
          <button
            class="btn"
            id="enterBtn"
            onclick="navigateTo('landing', 'journal')"
            disabled
          >
            [꿈 기록하러 가기]
          </button>
        </div>
        <div class="scroll-space"></div>
      </section>

      <!-- ================= -->

      <section id="journal">
        <div class="journal-bg-wrapper">
          <div class="bg-sph"></div>
          <div class="bg-lines"></div>
          <div class="bg-dots"></div>
          <img src="./pic/neo-obj.svg" class="bg-neo" alt="Neon Object" />
          <div class="bg-gradient"></div>
        </div>

        <div class="journal-fixed-content">
          <div class="journal-container">
            <textarea
              class="glass-textarea"
              placeholder="이곳에 방금 꾼 꿈의 파편들을 기록하세요..."
            ></textarea>

            <div class="tags" id="tagContainer">
              <div class="chip">일반 꿈</div>
              <div class="chip">자각몽</div>
              <div class="chip">가위눌림</div>
              <div class="chip">악몽</div>
              <div class="chip">길몽</div>
            </div>

            <button
              class="btn btn-light"
              onclick="navigateTo('journal', 'analysis')"
            >
              [무의식 분석하기]
            </button>
          </div>
        </div>

        <div class="journal-scroll-space"></div>
      </section>

      <!-- ================= -->

      <section id="analysis">
        <div class="analysis-container" id="analysisSpace">
          <svg class="lines-svg" id="linesSvg"></svg>
          <div class="bg-dots"></div>

          <div class="sphere-container" id="centerSphere">
            <img
              src="./pic/sphere.svg"
              alt="Purple Sphere"
              class="blob-sphere"
            />
          </div>

          <div class="constellation">
            <div class="keyword kw-1" id="kw1">바다</div>
            <div class="keyword kw-2" id="kw2">추적</div>
            <div class="keyword kw-3" id="kw3">바다</div>
            <div class="keyword kw-4" id="kw4">보상</div>
          </div>
        </div>
      </section>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
